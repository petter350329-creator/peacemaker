name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pacemaker-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pacemaker-apk
          path: pacemaker-${{ github.run_number }}.apk

      # 폰에서 받기 쉽게 Releases 에도 올림
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 페이스메이커 빌드 ${{ github.run_number }}
          files: pacemaker-${{ github.run_number }}.apk
          make_latest: true
