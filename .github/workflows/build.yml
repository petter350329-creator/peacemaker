name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 러너에 안드로이드 SDK가 이미 깔려 있음 → 라이선스만 동의
      - name: Accept Android licenses
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      # 화면 스크린샷 (디자인 확인용)
      - name: Screenshots
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/build/screenshots/
            app/build/reports/tests/

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pacemaker-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pacemaker-apk
          path: pacemaker-${{ github.run_number }}.apk

      # 폰에서 받기 쉽게 Releases 에도 올림
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 페이스메이커 빌드 ${{ github.run_number }}
          files: |
            pacemaker-${{ github.run_number }}.apk
            app/build/screenshots/*.png
          fail_on_unmatched_files: false
          make_latest: true
